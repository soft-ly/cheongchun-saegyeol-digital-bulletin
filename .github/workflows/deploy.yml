name: Update sermon and deploy

on:
  schedule:
    # Every Tuesday 11:00 UTC = 20:00 KST (GitHub may start it a few hours late)
    - cron: '0 11 * * 2'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Fails (red run + email) if the sermon can't be parsed; never publishes a half-updated page.
      - name: Update Worship tab from YouTube
        # On a manual push, a YouTube/parse problem must not block deploying your own edits.
        continue-on-error: ${{ github.event_name == 'push' }}
        run: python3 scripts/auto_update_sermon.py

      - name: Commit updated index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update Worship tab with latest sermon"
            git push
          fi

      # Build from the working tree (which already contains the update), and publish only site files.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html app.js style.css assets _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
